<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0a0f1d"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect x="20" y="20" width="960" height="610" fill="none" stroke="#00F5D4" stroke-width="1.5" stroke-dasharray="12 4"/>

  <!-- Title Block -->
  <rect x="680" y="530" width="295" height="90" fill="#111827" stroke="#00F5D4" stroke-width="1.5"/>
  <text x="695" y="555" fill="#00F5D4" font-family="monospace" font-size="12" font-weight="bold">INDIAN DEFENCE STANDARD JSG 0852</text>
  <text x="695" y="575" fill="#ffffff" font-family="monospace" font-size="11">FIG 03: GAS SYSTEM &amp; BARREL LINKAGE</text>
  <text x="695" y="595" fill="#94a3b8" font-family="monospace" font-size="10">DWG NO: SSS-BRL-2026-C3 | SHT 3 OF 4</text>
  <text x="695" y="612" fill="#ef4444" font-family="monospace" font-size="9" font-weight="bold">RESTRICTED - MILITARY USE ONLY</text>

  <!-- Cold Hammer Forged Barrel -->
  <rect x="150" y="270" width="650" height="50" fill="#334155" stroke="#00F5D4" stroke-width="2"/>
  <polygon points="120,265 150,270 150,320 120,325" fill="#1e293b" stroke="#00F5D4" stroke-width="2"/>
  <!-- Muzzle Flash Hider -->
  <rect x="100" y="260" width="25" height="68" fill="#0f172a" stroke="#00F5D4" stroke-width="1.5"/>

  <!-- Gas Block Collar -->
  <rect x="350" y="230" width="80" height="95" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <!-- Gas Tube / Pushrod -->
  <rect x="430" y="240" width="370" height="15" fill="#475569" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Barrel Nut & Extension -->
  <rect x="740" y="250" width="70" height="90" fill="#0f172a" stroke="#00F5D4" stroke-width="2"/>

  <!-- Callouts -->
  <!-- Callout 1: Gas Regulator Collar -->
  <g transform="translate(390, 180)">
    <circle cx="0" cy="0" r="14" fill="#000000" stroke="#00F5D4" stroke-width="2"/>
    <text x="0" y="4" fill="#00F5D4" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1</text>
    <line x1="0" y1="14" x2="0" y2="45" stroke="#00F5D4" stroke-width="1.5"/>
  </g>

  <!-- Callout 2: Piston Pushrod -->
  <g transform="translate(560, 200)">
    <circle cx="0" cy="0" r="14" fill="#000000" stroke="#00F5D4" stroke-width="2"/>
    <text x="0" y="4" fill="#00F5D4" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">2</text>
    <line x1="0" y1="14" x2="0" y2="35" stroke="#00F5D4" stroke-width="1.5"/>
  </g>

  <!-- Callout 3: Barrel Retaining Nut -->
  <g transform="translate(775, 200)">
    <circle cx="0" cy="0" r="14" fill="#000000" stroke="#00F5D4" stroke-width="2"/>
    <text x="0" y="4" fill="#00F5D4" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">3</text>
    <line x1="0" y1="14" x2="0" y2="45" stroke="#00F5D4" stroke-width="1.5"/>
  </g>
</svg>

