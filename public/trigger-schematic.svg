<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0a0f1d"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect x="20" y="20" width="960" height="610" fill="none" stroke="#00F5D4" stroke-width="1.5" stroke-dasharray="12 4"/>

  <!-- Title Block -->
  <rect x="680" y="530" width="295" height="90" fill="#111827" stroke="#00F5D4" stroke-width="1.5"/>
  <text x="695" y="555" fill="#00F5D4" font-family="monospace" font-size="12" font-weight="bold">INDIAN DEFENCE STANDARD JSG 0852</text>
  <text x="695" y="575" fill="#ffffff" font-family="monospace" font-size="11">FIG 02: TRIGGER &amp; FIRE CONTROL GROUP</text>
  <text x="695" y="595" fill="#94a3b8" font-family="monospace" font-size="10">DWG NO: SSS-TRG-2026-B2 | SHT 2 OF 4</text>
  <text x="695" y="612" fill="#ef4444" font-family="monospace" font-size="9" font-weight="bold">RESTRICTED - MILITARY USE ONLY</text>

  <!-- Trigger Housing -->
  <path d="M 280 200 L 680 200 L 680 380 L 520 420 L 460 380 L 280 380 Z" fill="#1e293b" stroke="#00F5D4" stroke-width="2"/>
  
  <!-- Hammer Mechanism -->
  <path d="M 360 220 C 340 180, 360 140, 400 130 C 440 120, 470 150, 460 190 Z" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="410" cy="180" r="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Trigger Bow -->
  <path d="M 470 320 C 500 370, 500 450, 460 480 C 440 490, 430 470, 450 440 C 460 410, 450 360, 430 330 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Disconnector -->
  <path d="M 460 270 L 540 270 L 530 330 L 450 330 Z" fill="#475569" stroke="#00F5D4" stroke-width="1.5"/>

  <!-- Safety Selector Cam -->
  <circle cx="580" cy="270" r="28" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <rect x="575" y="246" width="10" height="48" fill="#ef4444"/>

  <!-- Callouts -->
  <!-- Callout 1: Hammer Spring Strut -->
  <g transform="translate(320, 160)">
    <circle cx="0" cy="0" r="14" fill="#000000" stroke="#00F5D4" stroke-width="2"/>
    <text x="0" y="4" fill="#00F5D4" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1</text>
    <line x1="14" y1="0" x2="50" y2="0" stroke="#00F5D4" stroke-width="1.5"/>
  </g>

  <!-- Callout 2: Disconnector Cam -->
  <g transform="translate(520, 220)">
    <circle cx="0" cy="0" r="14" fill="#000000" stroke="#00F5D4" stroke-width="2"/>
    <text x="0" y="4" fill="#00F5D4" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">2</text>
    <line x1="0" y1="14" x2="0" y2="45" stroke="#00F5D4" stroke-width="1.5"/>
  </g>

  <!-- Callout 3: Trigger Pivot Bushing -->
  <g transform="translate(620, 360)">
    <circle cx="0" cy="0" r="14" fill="#000000" stroke="#00F5D4" stroke-width="2"/>
    <text x="0" y="4" fill="#00F5D4" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">3</text>
    <line x1="-14" y1="0" x2="-80" y2="0" stroke="#00F5D4" stroke-width="1.5"/>
  </g>
</svg>

