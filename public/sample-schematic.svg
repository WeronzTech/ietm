<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0a0f1d"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Border & Technical Title Block -->
  <rect x="20" y="20" width="960" height="610" fill="none" stroke="#00F5D4" stroke-width="1.5" stroke-dasharray="12 4"/>
  <rect x="25" y="25" width="950" height="600" fill="none" stroke="#334155" stroke-width="0.8"/>
  
  <rect x="680" y="530" width="295" height="90" fill="#111827" stroke="#00F5D4" stroke-width="1.5"/>
  <text x="695" y="555" fill="#00F5D4" font-family="monospace" font-size="12" font-weight="bold">INDIAN DEFENCE STANDARD JSG 0852</text>
  <text x="695" y="575" fill="#ffffff" font-family="monospace" font-size="11">FIG 01: RECEIVER &amp; BOLT MECHANISM</text>
  <text x="695" y="595" fill="#94a3b8" font-family="monospace" font-size="10">DWG NO: SSS-RCV-2026-A1 | SHT 1 OF 4</text>
  <text x="695" y="612" fill="#ef4444" font-family="monospace" font-size="9" font-weight="bold">RESTRICTED - MILITARY USE ONLY</text>

  <!-- Upper Receiver Housing -->
  <path d="M 180 220 L 720 220 L 740 260 L 740 330 L 700 350 L 260 350 L 220 310 L 180 310 Z" fill="url(#metal)" stroke="#00F5D4" stroke-width="2.5"/>
  <text x="200" y="245" fill="#00F5D4" font-family="monospace" font-size="11">UPPER RECEIVER (AL-7075-T6)</text>
  <rect x="340" y="250" width="180" height="60" rx="4" fill="#0b1320" stroke="#00F5D4" stroke-width="1.5"/>
  <text x="360" y="285" fill="#94a3b8" font-family="monospace" font-size="10">EJECTION PORT</text>

  <!-- Bolt Carrier Unit -->
  <rect x="360" y="260" width="220" height="40" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="380" cy="280" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="395" y1="280" x2="570" y2="280" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="420" y="285" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">BOLT CARRIER GROUP</text>

  <!-- Recoil Spring Guide -->
  <path d="M 580 275 C 600 265, 610 295, 630 275 C 650 265, 660 295, 680 275 C 700 265, 710 295, 730 275" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="580" y1="280" x2="740" y2="280" stroke="#94a3b8" stroke-width="1"/>
  
  <!-- Charging Handle -->
  <path d="M 330 200 L 460 200 L 460 220 L 310 220 Z" fill="#334155" stroke="#00F5D4" stroke-width="1.5"/>
  <circle cx="315" cy="210" r="8" fill="#1e293b" stroke="#00F5D4" stroke-width="1.5"/>

  <!-- Firing Pin -->
  <line x1="365" y1="280" x2="340" y2="280" stroke="#ef4444" stroke-width="3"/>
  <polygon points="340,277 330,280 340,283" fill="#ef4444"/>

  <!-- Technical Dimension Lines -->
  <line x1="180" y1="375" x2="740" y2="375" stroke="#64748b" stroke-width="1"/>
  <line x1="180" y1="365" x2="180" y2="385" stroke="#64748b" stroke-width="1"/>
  <line x1="740" y1="365" x2="740" y2="385" stroke="#64748b" stroke-width="1"/>
  <text x="430" y="395" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">TOTAL LENGTH: 560 mm ± 0.5 mm</text>

  <!-- Callout Markers (Interactivity targets: 1, 2, 3, 4, 5) -->
  <!-- Callout 1: Upper Receiver Housing -->
  <g transform="translate(240, 200)">
    <circle cx="0" cy="0" r="14" fill="#000000" stroke="#00F5D4" stroke-width="2"/>
    <text x="0" y="4" fill="#00F5D4" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1</text>
    <line x1="0" y1="14" x2="0" y2="40" stroke="#00F5D4" stroke-width="1.5"/>
  </g>

  <!-- Callout 2: Bolt Carrier Subassembly -->
  <g transform="translate(470, 240)">
    <circle cx="0" cy="0" r="14" fill="#000000" stroke="#00F5D4" stroke-width="2"/>
    <text x="0" y="4" fill="#00F5D4" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">2</text>
    <line x1="0" y1="14" x2="0" y2="35" stroke="#00F5D4" stroke-width="1.5"/>
  </g>

  <!-- Callout 3: Recoil Return Spring -->
  <g transform="translate(650, 240)">
    <circle cx="0" cy="0" r="14" fill="#000000" stroke="#00F5D4" stroke-width="2"/>
    <text x="0" y="4" fill="#00F5D4" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">3</text>
    <line x1="0" y1="14" x2="0" y2="32" stroke="#00F5D4" stroke-width="1.5"/>
  </g>

  <!-- Callout 4: Charging Handle -->
  <g transform="translate(370, 160)">
    <circle cx="0" cy="0" r="14" fill="#000000" stroke="#00F5D4" stroke-width="2"/>
    <text x="0" y="4" fill="#00F5D4" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">4</text>
    <line x1="0" y1="14" x2="0" y2="38" stroke="#00F5D4" stroke-width="1.5"/>
  </g>

  <!-- Callout 5: Striker Pin & Retainer -->
  <g transform="translate(330, 310)">
    <circle cx="0" cy="0" r="14" fill="#000000" stroke="#00F5D4" stroke-width="2"/>
    <text x="0" y="4" fill="#00F5D4" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">5</text>
    <line x1="0" y1="-14" x2="0" y2="-28" stroke="#00F5D4" stroke-width="1.5"/>
  </g>
</svg>

